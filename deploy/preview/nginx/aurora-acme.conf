# Aurora public-preview ACME challenge vhosts (HTTP-only, used during certbot
# issuance BEFORE the TLS vhosts exist). Loaded via a bind mount into the
# shared Lumina nginx container. Only serves the Let's Encrypt http-01
# challenge and redirects everything else to HTTPS. Removed/replaced by the
# full TLS vhost after certificates are issued.

server {
    listen 80;
    listen [::]:80;
    server_name aurora.ah.cn www.aurora.ah.cn ingest.aurora.ah.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
