extends:
  - recommended
rules:
  info-license: off
  info-license-strict: off
  security-defined: off
  no-unused-components: off
  no-ambiguous-paths: off
  operation-4xx-response: off
  operation-2xx-response: off
  operation-description: off
  tag-description: off
  tags-alphabetical: off
  no-empty-servers: off
apis:
  platform@v1:
    root: docs/api/platform-openapi-v1.yaml
    rules:
      # OpenAPI 3.1 uses JSON Schema 2020-12, which drops the draft-04 `nullable` keyword.
      # The platform-contract generator emits nullable: true for nullable() schemas; suppress
      # struct only for this file until the generator emits 3.1-style type unions.
      struct: off
