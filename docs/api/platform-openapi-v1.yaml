                          - read_only
                    additionalProperties: false
                    required:
                      - projectId
                      - projectRole
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - orgRole
                - idempotencyKey
  /organizations/{organizationId}/invitations/{invitationId}/revoke:
    post:
