      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityCancelAccountDeletionResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - currentPassword
                - idempotencyKey
  /invitations/accept:
