      tags:
        - monitoring
        - diagnostics
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/diagnosticsGetDataStatusResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: projectId
          in: path
          required: true
          schema: *a6
        - name: query
          in: query
          schema:
            type: object
            properties:
              timeRange: *a8
            additionalProperties: false
  /organizations/{organizationId}/projects/{projectId}/performance:
    get:
      operationId: performanceListPages
      summary: List performance metric projections for a project time window
        (LCP/INP/CLS/page-load)
      tags:
        - monitoring
        - performance
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/performanceListPagesResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: projectId
          in: path
          required: true
          schema: *a6
        - name: query
          in: query
          schema:
            type: object
            properties:
              timeRange: *a8
            additionalProperties: false
  /organizations/{organizationId}/usage:
    get:
      operationId: usageGetSummary
      summary: Resolve the organization periodic resource usage and degradation stage
        (PRD §15) from real processed data
      tags:
        - usage-and-policy
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usageGetSummaryResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
  /organizations/{organizationId}/projects/{projectId}/issues/{issueId}/state:
    post:
      operationId: issuesUpdateState
      summary: Transition an Issue lifecycle state (PRD §10.1—§10.5) with optimistic
        version
      tags:
        - issues-and-alerts
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/issuesUpdateStateResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: projectId
          in: path
          required: true
          schema: *a6
        - name: issueId
          in: path
          required: true
          schema: &a9
            type: string
            minLength: 1
            maxLength: 64
            description: IssueId
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  minLength: 1
                  maxLength: 16
                version:
                  type: number
                  minimum: 1
                resolution:
                  type: object
