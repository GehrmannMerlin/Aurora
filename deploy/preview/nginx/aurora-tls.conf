# Aurora public-preview full TLS vhosts (active after certificates issued).
# Loaded via bind mount into the shared Lumina nginx container. Serves:
#   aurora.ah.cn / www.aurora.ah.cn  -> built Vue SPA (console service)
#   ingest.aurora.ah.cn              -> ingestion-api POST /v1/batches
# TLS certs from host certbot at /etc/letsencrypt/live/aurora.ah.cn/ (SAN covers
# both aurora.ah.cn and ingest.aurora.ah.cn).
#
# The previous aurora.ah.cn 443 block served preview-status.html. It now proxies
# to the `console` compose service (nginx SPA server with its own try_files
# fallback). preview-status.html stays in the repo so rollback to the status page
# is a one-release revert.

# --- ingest.aurora.ah.cn : data ingestion API ---
server {
    listen 80;
    listen [::]:80;
    server_name ingest.aurora.ah.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ingest.aurora.ah.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ingest.aurora.ah.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/aurora.ah.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurora.ah.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AuroraIngestTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /v1/batches {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aurora_upstream http://ingestion-api:8080;
        proxy_pass $aurora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        access_log off; # sensitive request bodies must not be logged
    }
    location / {
        return 404;
    }
}

# --- aurora.ah.cn : built Vue SPA (proxied to the console service) ---
server {
    listen 80;
    listen [::]:80;
    server_name aurora.ah.cn www.aurora.ah.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://aurora.ah.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aurora.ah.cn www.aurora.ah.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/aurora.ah.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurora.ah.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AuroraConsoleTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Platform API: same-origin /api/platform/* -> platform-api compose service.
    # Declared before the SPA fallback; the longer prefix always wins, so the
    # console's /api/platform/v1/... calls reach the API, never the SPA fallback.
    location /api/platform/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $platform_upstream http://platform-api:8787;
        proxy_pass $platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie; # session cookie must pass through
        access_log off;
    }

    # aurora.ah.cn now serves the built Vue SPA (try_files fallback inside console nginx).
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $console_upstream http://console:80;
        proxy_pass $console_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off; # no request bodies / sensitive query strings in logs
    }
}
