# 由契约源码生成、禁止手工修改
openapi: 3.1.0
info:
  title: Aurora Platform API
  version: v1
servers:
  - url: /api/platform/v1
paths:
  /session:
    get:
      operationId: identityGetSession
      summary: Resolve the current account session projection and CSRF token
      tags:
        - identity
        - session
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityGetSessionResponse"
  /navigation/context:
    get:
      operationId: navigationGetContext
      summary: Resolve the authorized navigation context for the current scope
      tags:
        - identity
        - navigation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/navigationGetContextResponse"
  /auth/register:
    post:
      operationId: identityRegister
      summary: Register a new account and create the personal workspace
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityRegisterResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: &a1
                  type: string
                  minLength: 36
                  maxLength: 36
              additionalProperties: false
              required:
                - email
                - password
                - idempotencyKey
  /auth/email/confirm:
    post:
      operationId: identityConfirmEmailVerification
      summary: Confirm a pending email verification intent (intent cookie + CSRF)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityConfirmEmailVerificationResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - idempotencyKey
  /auth/login:
    post:
      operationId: identityLogin
      summary: Authenticate an account and establish a session
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityLoginResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - password
                - idempotencyKey
  /auth/logout:
    post:
      operationId: identityLogout
      summary: Revoke the current session and sign out
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityLogoutResponse"
  /auth/password/request:
    post:
      operationId: identityRequestPasswordReset
      summary: Request a password reset email (enumeration-safe)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityRequestPasswordResetResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - idempotencyKey
  /auth/password/confirm:
    post:
      operationId: identityConfirmPasswordReset
      summary: Confirm a password reset intent and set a new password
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityConfirmPasswordResetResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - newPassword
                - idempotencyKey
  /auth/password/change:
    post:
      operationId: identityChangePassword
      summary: Change the current password and revoke all sessions
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityChangePasswordResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
                - idempotencyKey
  /account/deletion/preflight:
