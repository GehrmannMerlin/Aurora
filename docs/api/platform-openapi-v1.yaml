# 由契约源码生成、禁止手工修改
openapi: 3.1.0
info:
  title: Aurora Platform API
  version: v1
servers:
  - url: /api/platform/v1
paths:
  /session:
    get:
      operationId: identityGetSession
      summary: Resolve the current account session projection and CSRF token
      tags:
        - identity
        - session
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityGetSessionResponse"
  /navigation/context:
    get:
      operationId: navigationGetContext
      summary: Resolve the authorized navigation context for the current scope
      tags:
        - identity
        - navigation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/navigationGetContextResponse"
  /auth/register:
    post:
      operationId: identityRegister
      summary: Register a new account and create the personal workspace
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityRegisterResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: &a1
                  type: string
                  minLength: 36
                  maxLength: 36
              additionalProperties: false
              required:
                - email
                - password
                - idempotencyKey
  /auth/email/confirm:
    post:
      operationId: identityConfirmEmailVerification
      summary: Confirm a pending email verification intent (intent cookie + CSRF)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityConfirmEmailVerificationResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - idempotencyKey
  /auth/email/resend:
    post:
      operationId: identityResendEmailVerification
      summary: Queue a replacement email verification intent for the current account
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityResendEmailVerificationResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - idempotencyKey
  /auth/login:
    post:
      operationId: identityLogin
      summary: Authenticate an account and establish a session
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityLoginResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - password
                - idempotencyKey
  /auth/logout:
    post:
      operationId: identityLogout
      summary: Revoke the current session and sign out
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityLogoutResponse"
  /auth/password/request:
    post:
      operationId: identityRequestPasswordReset
      summary: Request a password reset email (enumeration-safe)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityRequestPasswordResetResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - idempotencyKey
  /auth/password/confirm:
    post:
      operationId: identityConfirmPasswordReset
      summary: Confirm a password reset intent and set a new password
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityConfirmPasswordResetResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - newPassword
                - idempotencyKey
  /auth/password/change:
    post:
      operationId: identityChangePassword
      summary: Change the current password and revoke all sessions
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityChangePasswordResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
                - idempotencyKey
  /account/deletion/preflight:
    get:
      operationId: identityDeleteAccountPreflight
      summary: Resolve the account deletion preflight projection (unique-owner blockers)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityDeleteAccountPreflightResponse"
  /account/deletion/request:
    post:
      operationId: identityRequestAccountDeletion
      summary: Send the account deletion confirmation email (creates the
        deletion_request intent)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityRequestAccountDeletionResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - idempotencyKey
  /account/deletion/intent/{token}:
    get:
      operationId: identityDeleteAccountIntentLink
      summary: Validate the account deletion confirmation link and establish the
        intent cookie
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityDeleteAccountIntentLinkResponse"
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
  /account/deletion:
    post:
      operationId: identityDeleteAccount
      summary: Request account deletion (dual verification + final unique-owner recheck)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityDeleteAccountResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - currentPassword
                - idempotencyKey
  /account/deletion/cancel/intent/{token}:
    get:
      operationId: identityCancelAccountDeletionIntentLink
      summary: Validate the deletion cancellation link and establish the intent cookie
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityCancelAccountDeletionIntentLinkResponse"
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
  /account/deletion/cancel:
    post:
      operationId: identityCancelAccountDeletion
      summary: Cancel an account deletion within the cooling window (intent cookie +
        CSRF)
      tags:
        - identity
        - auth
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identityCancelAccountDeletionResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                  maxLength: 256
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - currentPassword
                - idempotencyKey
  /invitations/accept:
    post:
      operationId: organizationAcceptInvitation
      summary: Accept an organization invitation atomically (intent cookie + CSRF)
      tags:
        - organization
        - invitation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationAcceptInvitationResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - idempotencyKey
  /organizations/{organizationId}/projects:
    get:
      operationId: organizationListProjects
      summary: List projects visible to the current account in an organization
      tags:
        - organization
        - workspace
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationListProjectsResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: &a2
            type: string
            minLength: 3
            maxLength: 64
            description: OrganizationId
    post:
      operationId: organizationCreateProject
      summary: Atomically create a project with default environment and client key
        (owner/admin)
      tags:
        - project-governance
        - workspace
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationCreateProjectResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
                frameworkType:
                  type: string
                  enum:
                    - javascript
                    - react
                    - vue
                    - other
                websiteUrl:
                  type: string
                  minLength: 8
                  maxLength: 512
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - name
                - frameworkType
                - idempotencyKey
  /organizations/{organizationId}/members:
    get:
      operationId: organizationListMembers
      summary: List organization members with masked emails
      tags:
        - organization
        - members
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationListMembersResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
  /organizations/{organizationId}/invitations:
    post:
      operationId: organizationInviteMember
      summary: Invite a member to an organization (atomic invite + audit)
      tags:
        - organization
        - invitation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationInviteMemberResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 320
                orgRole:
                  type: string
                  enum:
                    - admin
                    - member
                projectGrants:
                  type: array
                  items:
                    type: object
                    properties:
                      projectId: &a6
                        type: string
                        minLength: 3
                        maxLength: 64
                        description: ProjectId
                      projectRole:
                        type: string
                        enum:
                          - project_admin
                          - developer
                          - read_only
                    additionalProperties: false
                    required:
                      - projectId
                      - projectRole
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - email
                - orgRole
                - idempotencyKey
  /organizations/{organizationId}/invitations/{invitationId}/revoke:
    post:
      operationId: organizationRevokeInvitation
      summary: Revoke a pending organization invitation
      tags:
        - organization
        - invitation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationRevokeInvitationResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: invitationId
          in: path
          required: true
          schema: &a3
            type: string
            minLength: 3
            maxLength: 64
            description: InvitationId
  /organizations/{organizationId}/invitations/{invitationId}/resend:
    post:
      operationId: organizationResendInvitation
      summary: Resend a pending organization invitation email
      tags:
        - organization
        - invitation
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationResendInvitationResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: invitationId
          in: path
          required: true
          schema: *a3
  /organizations/{organizationId}/members/{accountId}/role:
    post:
      operationId: organizationChangeRole
      summary: Change an organization member role (never to/from owner)
      tags:
        - organization
        - members
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationChangeRoleResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: accountId
          in: path
          required: true
          schema: &a4
            type: string
            minLength: 3
            maxLength: 64
            description: AccountId
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orgRole:
                  type: string
                  enum:
                    - admin
                    - member
                resourceVersion: &a5
                  type: string
                  minLength: 1
                  maxLength: 64
              additionalProperties: false
              required:
                - orgRole
                - resourceVersion
  /organizations/{organizationId}/members/{accountId}/remove:
    post:
      operationId: organizationRemoveMember
      summary: Remove a member from an organization (never the last owner)
      tags:
        - organization
        - members
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationRemoveMemberResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: accountId
          in: path
          required: true
          schema: *a4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceVersion: *a5
              additionalProperties: false
              required:
                - resourceVersion
  /organizations/{organizationId}/ownership:
    post:
      operationId: organizationTransferOwnership
      summary: Transfer organization ownership atomically (owner invariant)
      tags:
        - organization
        - members
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationTransferOwnershipResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newOwnerAccountId: *a4
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - newOwnerAccountId
                - idempotencyKey
  /organizations/{organizationId}/settings/timezone:
    patch:
      operationId: organizationUpdateTimezone
      summary: Update the organization business timezone (versioned)
      tags:
        - organization
        - settings
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationUpdateTimezoneResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                resourceVersion: *a5
              additionalProperties: false
              required:
                - timezone
                - resourceVersion
  /organizations/{organizationId}/trash:
    get:
      operationId: projectGovernanceListTrash
      summary: List recoverable trashed projects (owner/admin)
      tags:
        - project-governance
        - trash
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/projectGovernanceListTrashResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
  /organizations/{organizationId}/trash/{projectId}/restore:
    post:
      operationId: projectGovernanceRestoreProject
      summary: Restore a trashed project within the recovery window (G10 safety rules)
      tags:
        - project-governance
        - trash
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/projectGovernanceRestoreProjectResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: projectId
          in: path
          required: true
          schema: *a6
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceVersion: *a5
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - resourceVersion
                - idempotencyKey
  /organizations/{organizationId}/private-tokens:
    get:
      operationId: credentialsListPrivateTokens
      summary: List private management tokens (metadata only, no secret)
      tags:
        - credentials
        - tokens
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/credentialsListPrivateTokensResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
    post:
      operationId: credentialsCreatePrivateToken
      summary: Create a private management token (one-time plaintext delivery)
      tags:
        - credentials
        - tokens
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/credentialsCreatePrivateTokenResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                scopes:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                expiresAt: &a7
                  type: string
                  format: date-time
                idempotencyKey: *a1
              additionalProperties: false
              required:
                - name
                - scopes
                - idempotencyKey
  /organizations/{organizationId}/private-tokens/{tokenId}/revoke:
    post:
      operationId: credentialsRevokePrivateToken
      summary: Irreversibly revoke a private management token
      tags:
        - credentials
        - tokens
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/credentialsRevokePrivateTokenResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: tokenId
          in: path
          required: true
          schema: &a26
            type: string
            minLength: 3
            maxLength: 64
            description: PrivateTokenId
  /organizations/{organizationId}/audit:
    get:
      operationId: auditListSecurityAudit
      summary: List the security audit timeline (redacted summaries)
      tags:
        - audit
        - security
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auditListSecurityAuditResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: query
          in: query
          schema:
            type: object
            properties:
              cursor:
                type: string
                minLength: 1
                maxLength: 64
              limit:
                type: number
                minimum: 1
                maximum: 100
            additionalProperties: false
            required:
              - limit
  /organizations/{organizationId}/projects/{projectId}/requests:
    get:
      operationId: requestsListEndpoints
      summary: List request endpoint metric projections for a project time window
      tags:
        - monitoring
        - requests
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/requestsListEndpointsResponse"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: *a2
        - name: projectId
          in: path
          required: true
          schema: *a6
        - name: query
          in: query
          schema:
            type: object
            properties:
              timeRange: &a8
                type: object
                properties:
                  start: *a7
                  end: *a7
                additionalProperties: false
                required:
                  - start
                  - end
              cursor:
                type: string
                minLength: 1
                maxLength: 4096
              limit:
                type: number
                minimum: 1
                maximum: 100
            additionalProperties: false
            required:
              - timeRange
  /organizations/{organizationId}/projects/{projectId}/data-status:
    get:
      operationId: diagnosticsGetDataStatus
      summary: Resolve the ingestion data-status diagnosis projection for a project
