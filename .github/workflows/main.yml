# Aurora Main Quality Gates — full gate on push to main.
# Implements OPS-01 spec §4.2. Adds real PostgreSQL 17.10 integration, coverage,
# and Chromium browser verification on top of the PR gates.
name: Main Quality Gates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint: workspace deps' dist is gitignored, so a
      # fresh checkout has no compiled types; lint's no-unsafe-* rules need them.
      - name: Build (workspace deps for type-aware lint)
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace policy
        run: pnpm --filter @aurora/workspace-policy test

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Package entry (event-schema)
        run: pnpm --filter @aurora/event-schema test:package

      - name: Package entry (core)
        run: pnpm --filter @aurora/core test:package

      - name: Package entry (browser)
        run: pnpm --filter @aurora/browser test:package

      - name: Package entry (plugin-error)
        run: pnpm --filter @aurora/plugin-error test:package

      - name: Package entry (plugin-request)
        run: pnpm --filter @aurora/plugin-request test:package

      - name: Package entry (plugin-performance)
        run: pnpm --filter @aurora/plugin-performance test:package

      # Console production-build gate (ADR-025 open-source PrimeVue line). See
      # the PR workflow note: the deployed Preview carried PrimeVue 5.x PrimeUI
      # license machinery because no console gate ran in CI.
      - name: Package entry (console)
        run: pnpm --filter @aurora/console test:package

  postgres-integration:
    name: PostgreSQL Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ingestion-inbox
          - ingestion-credentials
          - processing-store
          - ingestion-api
          - ingestion-worker
          - ingestion-benchmark
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_test_pw
          POSTGRES_DB: aurora_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora_ci_test_pw@localhost:5432/aurora_inbox_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build workspace deps: integration suites import @aurora/* packages whose
      # dist/ is gitignored and absent on a fresh checkout (e.g. benchmark ->
      # ingestion-worker -> processing-store).
      - name: Build (workspace deps for integration tests)
        run: pnpm build

      # Each suite runs against its own PostgreSQL service container. Some
      # suites (ingestion-api, ingestion-credentials) apply migrations without
      # a schema reset, so a shared DB with prior-suite pgmigrations would trip
      # node-pg-migrate's checkOrder. Per-suite isolation removes ordering
      # dependence (OPS-01 spec §5.2).
      - name: Integration
        run: pnpm --filter @aurora/${{ matrix.suite }} test:integration

  platform-integration:
    name: Platform Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - platform-identity
          - platform-organization
          - platform-project-governance
          - platform-credentials
          - platform-audit
          - platform-session
          - platform-email
          - platform-api
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_test_pw
          POSTGRES_DB: aurora_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora_ci_test_pw@localhost:5432/aurora_inbox_test
      AURORA_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (workspace deps for integration tests)
        run: pnpm build

      # Each platform suite runs its own PostgreSQL+Redis service containers
      # (per-suite isolation, OPS-01 spec §5.2). Run the package's integration
      # tests AND its coverage against the live services so the DB/Redis-dependent
      # platform packages' coverage thresholds are enforced in CI (the no-DB
      # Quality job's `pnpm test:coverage` is scoped to the non-DB packages per
      # the OPS-01 spec coverage row).
      - name: Integration
        run: pnpm --filter @aurora/${{ matrix.suite }} test:integration
      - name: Coverage
        run: pnpm --filter @aurora/${{ matrix.suite }} test:coverage

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (workspace deps for browser tests)
        run: pnpm build

      - name: Install Chromium (with deps)
        run: pnpm --filter @aurora/browser exec playwright install --with-deps chromium

      - name: Browser (browser)
        run: pnpm --filter @aurora/browser test:browser

      - name: Browser (plugin-error)
        run: pnpm --filter @aurora/plugin-error test:browser

      - name: Browser (plugin-request)
        run: pnpm --filter @aurora/plugin-request test:browser

      - name: Browser (plugin-performance)
        run: pnpm --filter @aurora/plugin-performance test:browser

      # Console browser gate: real-Chromium reachability, axe a11y, and the
      # PrimeUI license regression spec (asserts no #p-license-host banner and
      # no license console warning across shell routes). Added in the G09
      # post-deployment stabilization hotfix.
      - name: Browser (console)
        run: pnpm --filter @aurora/console test:browser
