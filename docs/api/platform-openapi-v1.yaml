                    - admin
                    - member
                resourceVersion: &a5
                  type: string
                  minLength: 1
                  maxLength: 64
              additionalProperties: false
              required:
                - orgRole
                - resourceVersion
  /organizations/{organizationId}/members/{accountId}/remove:
    post:
      operationId: organizationRemoveMember
      summary: Remove a member from an organization (never the last owner)
      tags:
        - organization
        - members
      responses:
        "200":
          description: 200 response
          content:
            application/json:
              schema:
