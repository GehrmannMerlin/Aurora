# Aurora Release Quality Gate — pre-release quality evidence.
# Implements OPS-01 spec §4.4. This round publishes NO artifacts: the gate
# establishes the trusted quality baseline for future OPS-05 (deploy) and G15
# (SDK publish). No OIDC, no Docker push, no npm publish, no deployment.
name: Release Quality Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        type: string
      release_type:
        description: 'SDK release type: stable (dist-tag latest) or prerelease (dist-tag next)'
        required: false
        type: choice
        default: stable
        options:
          - stable
          - prerelease

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint: workspace deps' dist is gitignored, so a
      # fresh checkout has no compiled types; lint's no-unsafe-* rules need them.
      - name: Build (workspace deps for type-aware lint)
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace policy
        run: pnpm --filter @aurora/workspace-policy test

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Package entry (all SDK packages)
        run: >-
          pnpm --filter @aurora/event-schema test:package &&
          pnpm --filter @aurora/core test:package &&
          pnpm --filter @aurora/browser test:package &&
          pnpm --filter @aurora/plugin-error test:package &&
          pnpm --filter @aurora/plugin-request test:package &&
          pnpm --filter @aurora/plugin-performance test:package

      - name: Release gate notice
        run: |
          echo "Release gate passed for version: $RELEASE_VERSION"
          echo "No artifact published in this OPS-01 round."
          echo "OPS-05 (deploy pipeline) and G15 (SDK publish) will add publish steps."

  postgres-integration:
    name: Release PostgreSQL Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ingestion-inbox
          - ingestion-credentials
          - processing-store
          - ingestion-api
          - ingestion-worker
          - ingestion-benchmark
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_test_pw
          POSTGRES_DB: aurora_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora_ci_test_pw@localhost:5432/aurora_inbox_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build workspace deps: integration suites import @aurora/* packages whose
      # dist/ is gitignored and absent on a fresh checkout (e.g. benchmark ->
      # ingestion-worker -> processing-store).
      - name: Build (workspace deps for integration tests)
        run: pnpm build

      # Each suite runs against its own PostgreSQL service container. Some
      # suites (ingestion-api, ingestion-credentials) apply migrations without
      # a schema reset, so a shared DB with prior-suite pgmigrations would trip
      # node-pg-migrate's checkOrder. Per-suite isolation removes ordering
      # dependence (OPS-01 spec §5.2).
      - name: Integration
        run: pnpm --filter @aurora/${{ matrix.suite }} test:integration

  platform-integration:
    name: Release Platform Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - platform-identity
          - platform-organization
          - platform-project-governance
          - platform-credentials
          - platform-audit
          - platform-session
          - platform-email
          - platform-api
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_test_pw
          POSTGRES_DB: aurora_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora_ci_test_pw@localhost:5432/aurora_inbox_test
      AURORA_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (workspace deps for integration tests)
        run: pnpm build

      # Platform suites run against their own PostgreSQL+Redis service
      # containers (per-suite isolation, OPS-01 spec §5.2). Coverage runs
      # against the live services so the DB/Redis-dependent platform packages'
      # thresholds are enforced (the no-DB Quality job's coverage is scoped to
      # the non-DB packages per the OPS-01 spec coverage row).
      - name: Integration
        run: pnpm --filter @aurora/${{ matrix.suite }} test:integration
      - name: Coverage
        run: pnpm --filter @aurora/${{ matrix.suite }} test:coverage

  browser-matrix:
    # OPS-02: full release compatibility matrix — engines + device/viewport +
    # Console accessibility (axe), same representative reference set as nightly.
    name: Release Browser Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (workspace deps for browser matrix)
        run: pnpm build

      - name: Install browsers (with deps)
        run: pnpm --filter @aurora/sdk-reference exec playwright install --with-deps chromium firefox webkit

      - name: SDK reference matrix
        run: pnpm --filter @aurora/sdk-reference test:matrix

      - name: Vue adapter matrix
        run: pnpm --filter @aurora/plugin-vue test:matrix

      - name: React adapter matrix
        run: pnpm --filter @aurora/plugin-react test:matrix

      - name: Console reference matrix (incl. axe)
        run: pnpm --filter @aurora/console test:matrix

  performance:
    # OPS-02: fixed performance-reference harness (release only). Reports SDK
    # init p95 against the approved budgets in a fixed environment and writes a
    # repeatable JSON report.
    name: Performance Reference
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (workspace deps for performance reference)
        run: pnpm build

      - name: Install Chromium (with deps)
        run: pnpm --filter @aurora/sdk-reference exec playwright install --with-deps chromium

      - name: Performance reference
        run: pnpm --filter @aurora/sdk-reference test:performance

      - name: Upload performance reference report
        uses: actions/upload-artifact@v4
        with:
          name: performance-reference
          path: .artifacts/reference/
          retention-days: 7

  sdk-release-gate:
    name: SDK Release Gate (validate/pack/compat/size)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (public SDK packages)
        run: >-
          pnpm --filter @aurora/event-schema --filter @aurora/core --filter @aurora/sdk
          --filter @aurora/browser --filter @aurora/plugin-error --filter @aurora/plugin-request
          --filter @aurora/plugin-performance --filter @aurora/plugin-vue --filter @aurora/plugin-react build
      - name: Release contract validate
        run: pnpm release:validate
      - name: Pack inspection
        run: pnpm release:pack
      - name: Compatibility gate
        run: pnpm release:compat
      - name: Size gate
        run: pnpm release:size

  sdk-publish:
    name: SDK Publish (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    needs: [release-gate, sdk-release-gate]
    if: inputs.release_type != '' && secrets.NPM_TOKEN != ''
    environment: sdk-npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Setup Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (public SDK packages)
        run: >-
          pnpm --filter @aurora/event-schema --filter @aurora/core --filter @aurora/sdk
          --filter @aurora/browser --filter @aurora/plugin-error --filter @aurora/plugin-request
          --filter @aurora/plugin-performance --filter @aurora/plugin-vue --filter @aurora/plugin-react build
      - name: Apply independent version plan
        run: pnpm release:version
      - name: Publish (provenance, protected environment)
        run: >-
          pnpm -r publish --no-git-checks --access public
          --tag ${{ inputs.release_type == 'prerelease' && 'next' || 'latest' }}
          --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release evidence
        run: |
          echo "release version: $RELEASE_VERSION"
          echo "release type: $RELEASE_TYPE"
          echo "dist-tag: ${{ inputs.release_type == 'prerelease' && 'next' || 'latest' }}"
          echo "committed SHA: $(git rev-parse HEAD)"
          echo "artifacts: see pack output above (pnpm -r publish packs each public package)"
