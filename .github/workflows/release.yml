# Aurora Release Quality Gate — pre-release quality evidence.
# Implements OPS-01 spec §4.4. This round publishes NO artifacts: the gate
# establishes the trusted quality baseline for future OPS-05 (deploy) and G15
# (SDK publish). No OIDC, no Docker push, no npm publish, no deployment.
name: Release Quality Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_test_pw
          POSTGRES_DB: aurora_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AURORA_TEST_DATABASE_URL: postgresql://aurora:aurora_ci_test_pw@localhost:5432/aurora_inbox_test
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace policy
        run: pnpm --filter @aurora/workspace-policy test

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Package entry (all SDK packages)
        run: >-
          pnpm --filter @aurora/event-schema test:package &&
          pnpm --filter @aurora/core test:package &&
          pnpm --filter @aurora/browser test:package &&
          pnpm --filter @aurora/plugin-error test:package &&
          pnpm --filter @aurora/plugin-request test:package &&
          pnpm --filter @aurora/plugin-performance test:package

      - name: Integration (all suites)
        run: >-
          pnpm --filter @aurora/ingestion-inbox test:integration &&
          pnpm --filter @aurora/ingestion-credentials test:integration &&
          pnpm --filter @aurora/processing-store test:integration &&
          pnpm --filter @aurora/ingestion-api test:integration &&
          pnpm --filter @aurora/ingestion-worker test:integration &&
          pnpm --filter @aurora/ingestion-benchmark test:integration

      - name: Release gate notice
        run: |
          echo "Release gate passed for version: $RELEASE_VERSION"
          echo "No artifact published in this OPS-01 round."
          echo "OPS-05 (deploy pipeline) and G15 (SDK publish) will add publish steps."
