      parameters:
        - name: organizationId
          in: path
          required: true
          schema: &a2
            type: string
            minLength: 3
            maxLength: 64
            description: OrganizationId
    post:
      operationId: organizationCreateProject
      summary: Atomically create a project with default environment and client key
