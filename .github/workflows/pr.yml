# Aurora PR Quality Gates — fast, trusted PR checks.
# Implements OPS-01 spec §4.1. No PostgreSQL integration (that's the main gate).
# No production secrets. Minimal permissions.
name: PR Quality Gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build before type-aware lint: workspace deps' dist is gitignored, so a
      # fresh checkout has no compiled types; lint's no-unsafe-* rules need them.
      - name: Build (workspace deps for type-aware lint)
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace policy
        run: pnpm --filter @aurora/workspace-policy test

      - name: Boundaries
        run: pnpm check:boundaries

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package entry (event-schema)
        run: pnpm --filter @aurora/event-schema test:package

      - name: Package entry (core)
        run: pnpm --filter @aurora/core test:package

      - name: Package entry (browser)
        run: pnpm --filter @aurora/browser test:package

      - name: Package entry (plugin-error)
        run: pnpm --filter @aurora/plugin-error test:package

      - name: Package entry (plugin-request)
        run: pnpm --filter @aurora/plugin-request test:package

      - name: Package entry (plugin-performance)
        run: pnpm --filter @aurora/plugin-performance test:package

      # Console production-build gate (ADR-025 open-source PrimeVue line). This
      # is a G09 post-deployment stabilization hotfix: PrimeVue 5.x's PrimeUI
      # license machinery ("Invalid PrimeUI License" banner) was present in the
      # deployed Preview because no console gate ran in CI. The package-entry
      # gate asserts the production bundle carries no PrimeUI commercial
      # license plumbing.
      - name: Package entry (console)
        run: pnpm --filter @aurora/console test:package

  browser:
    # OPS-02: PR keeps the core Chromium compatibility smoke only. The full
    # browser/device/accessibility matrix runs in nightly/release.
    name: Browser (Core Chromium Reference Smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build workspace deps: the reference fixture serves @aurora/* dist.
      - name: Build (workspace deps for reference smoke)
        run: pnpm build

      - name: Install Chromium (with deps)
        run: pnpm --filter @aurora/sdk-reference exec playwright install --with-deps chromium

      - name: SDK reference smoke (Chromium)
        run: pnpm --filter @aurora/sdk-reference test:browser
